global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    stack: argus

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: checkout-api
    static_configs: [{targets: ["checkout-api:8000"]}]

  - job_name: loadgen
    static_configs: [{targets: ["loadgen:9109"]}]

  - job_name: detector
    static_configs: [{targets: ["detector:9110"]}]

  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
